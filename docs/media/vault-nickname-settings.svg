<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Vault Nickname settings in Obsidian</title>
  <desc id="desc">Dark Obsidian settings panel showing the vault nickname, app title order, and nickname storage dropdown set to Vault config folder.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242c"/>
      <stop offset="1" stop-color="#1a1e25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="20" fill="#0f1116"/>
  <rect x="24" y="24" width="1152" height="472" rx="16" fill="url(#panel)" stroke="#434957" filter="url(#shadow)"/>

  <rect x="24" y="24" width="270" height="472" rx="16" fill="#151920"/>
  <path d="M294 24V496" stroke="#353b47"/>

  <circle cx="58" cy="57" r="11" fill="#ff5f57"/>
  <circle cx="92" cy="57" r="11" fill="#febc2e"/>
  <circle cx="126" cy="57" r="11" fill="#28c840"/>

  <rect x="48" y="104" width="222" height="42" rx="21" fill="#101319" stroke="#3b4352"/>
  <circle cx="70" cy="125" r="7" fill="none" stroke="#8993a5" stroke-width="2"/>
  <path d="M75 130l7 7" stroke="#8993a5" stroke-width="2" stroke-linecap="round"/>
  <text x="94" y="132" fill="#8993a5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Search settings…</text>

  <text x="50" y="191" fill="#e85b67" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">Community plugins</text>
  <text x="58" y="237" fill="#c9ced8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Omnisearch</text>
  <text x="58" y="278" fill="#c9ced8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Outliner</text>
  <rect x="42" y="302" width="238" height="48" rx="4" fill="#5d2730" stroke="#a54450"/>
  <text x="58" y="333" fill="#f0dce0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Vault Nickname</text>

  <text x="338" y="65" fill="#d6dae2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="650">Settings — Vault Nickname</text>
  <path d="M318 88H1140" stroke="#343a46"/>

  <text x="350" y="147" fill="#dce0e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="600">Vault nickname</text>
  <text x="350" y="179" fill="#9ca5b5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Override the vault's display name.</text>
  <rect x="790" y="121" width="286" height="48" rx="5" fill="#151920" stroke="#4b5363"/>
  <text x="811" y="152" fill="#dce0e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Project docs</text>
  <rect x="1088" y="121" width="50" height="48" rx="5" fill="#2b313b"/>
  <path d="M1103 144h20M1113 134v20M1106 137l7-7 7 7" fill="none" stroke="#bac2cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M338 211H1138" stroke="#343a46"/>

  <text x="350" y="270" fill="#dce0e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="600">Nickname in app title</text>
  <text x="350" y="302" fill="#9ca5b5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Position and use of vault nickname in the app title.</text>
  <rect x="858" y="245" width="280" height="48" rx="5" fill="#2b313b"/>
  <text x="881" y="276" fill="#dce0e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">File name first</text>
  <path d="M1112 264l7 8 7-8" fill="none" stroke="#bac2cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M338 334H1138" stroke="#343a46"/>

  <text x="350" y="393" fill="#dce0e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="600">Nickname storage</text>
  <text x="350" y="425" fill="#9ca5b5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Choose where each vault stores its authoritative nickname file.</text>
  <rect x="812" y="368" width="326" height="48" rx="5" fill="#2b313b" stroke="#5a6476"/>
  <text x="835" y="399" fill="#dce0e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Vault config folder</text>
  <path d="M1112 387l7 8 7-8" fill="none" stroke="#bac2cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
